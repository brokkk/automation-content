# render.yaml - Render.com deployment config
services:
  - type: web
    name: autocontent-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npx playwright install chromium --with-deps && npx tsc
    startCommand: node dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_MODEL
        value: deepseek/deepseek-v3.2
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
